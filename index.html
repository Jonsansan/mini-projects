<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="h1" id="pagetitle">
          Mini Project- intro into JS and bootstrap
        </div>
      </div>
    </div>
  </div>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <div class="card" style="width: 18rem">
            <div class="card-body">
              <h5 class="card-title">tip calculator</h5>
              <div class="input-group">
                <span class="input-group-text" id="visible-addon">$</span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="dollar-ammount"
                  aria-describedby="visible-addon"
                />
                <input
                  type="text"
                  class="form-control d-none"
                  placeholder="Hidden input"
                  aria-label="Hidden input"
                  aria-describedby="visible-addon"
                />
              </div>
              <br />
              <div class="h4">tip percentage:</div>
              <div class="input-group flex-nowrap">
                <span class="input-group-text" id="addon-wrapping">%</span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="tip-percentage"
                  aria-describedby="addon-wrapping"
                />
              </div>
              <br />
              <a href="#" class="btn btn-primary">calculate</a>
              <br />
              <br />
              <div class="col" id="tip-result-header">
                <h4>Tip Amount: $0.00</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card" style="width: 18rem">
            <div class="card-body">
              <h5 class="card-title">paycheck calculator</h5>
              <br />
              <div class="h6">hours worked</div>
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="hours-ammount"
                  aria-describedby="visible-addon"
                />
                <input
                  type="text"
                  class="form-control d-none"
                  placeholder="Hidden input"
                  aria-label="Hidden input"
                  aria-describedby="visible-addon"
                />
              </div>
              <br />
              <div class="h4">hourly rate:</div>
              <div class="input-group flex-nowrap">
                <span class="input-group-text" id="addon-wrapping">$</span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="hourly-rate"
                  aria-describedby="addon-wrapping"
                />
              </div>
              <br />
              <a href="#" class="btn btn-primary">calculate</a>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card" style="width: 18rem">
            <div class="card-body">
              <h5 class="card-title">grade calculator</h5>
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="grade-ammount"
                  aria-describedby="visible-addon"
                />
                <input
                  type="text"
                  class="form-control d-none"
                  placeholder="Hidden input"
                  aria-label="Hidden input"
                  aria-describedby="visible-addon"
                />
              </div>
              <br />
              <div class="h4">grade percentage:</div>
              <div class="input-group flex-nowrap">
                <input
                  type="text"
                  class="form-control"
                  placeholder="0.00"
                  aria-label="grade-points"
                  aria-describedby="addon-wrapping"
                />
              </div>
              <br />
              <a href="#" class="btn btn-primary">calculate</a>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">gas cost calculator</h5>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              placeholder="0.00"
              aria-label="gas-tank-ammount"
              aria-describedby="visible-addon"
            />
            <input
              type="text"
              class="form-control d-none"
              placeholder="Hidden input"
              aria-label="Hidden input"
              aria-describedby="visible-addon"
            />
          </div>
          <br />
          <div class="h4">price per gallon:</div>
          <div class="input-group flex-nowrap">
            <span class="input-group-text" id="addon-wrapping">$</span>
            <input
              type="text"
              class="form-control"
              placeholder="0.00"
              aria-label="price-per-gallon"
              aria-describedby="addon-wrapping"
            />
          </div>
          <br />
          <a href="#" class="btn btn-primary">calculate</a>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
